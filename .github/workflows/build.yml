name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build AI upscale models
        shell: bash
        run: |
          set -o pipefail
          (
            pip install tensorflow-cpu numpy
            mkdir -p app/src/main/assets work
            curl -sL -o work/general.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-general-x4v3.pth
            curl -sL -o work/fast.pth https://github.com/xinntao/Real-ESRGAN/releases/download/v0.2.5.0/realesr-animevideov3.pth
            python tools/convert.py work/general.pth 32 app/src/main/assets/sr_hq.tflite
            python tools/convert.py work/fast.pth 16 app/src/main/assets/sr_fast.tflite
            ls -la app/src/main/assets
          ) 2>&1 | tee conv.log
      - name: Accept licenses
        run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.5
      - name: Build
        run: gradle assembleDebug --no-daemon --console=plain 2>&1 | tee build.log; exit ${PIPESTATUS[0]}
        shell: bash
      - name: Save log on failure
        if: failure()
        run: |
          git config user.name bot && git config user.email bot@x.y
          git checkout -b buildlog
          (tail -n 30 conv.log; grep -E "^e: |error:|What went wrong|Could not|FAILED|> " build.log | head -60) > errors.txt || true
          git add -f errors.txt
          git commit -m "errors" && git push -f origin buildlog
      - uses: actions/upload-artifact@v4
        with:
          name: PortraitCam-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk PortraitCam.apk
          gh release delete latest -y --cleanup-tag || true
          gh release create latest PortraitCam.apk --title "PortraitCam APK" --notes "Install PortraitCam.apk"
